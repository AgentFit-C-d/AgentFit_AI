name: AI service Linux checks

on:
  push:
    paths:
      - ai_service/**
      - specs/ai-developer/**
      - .github/workflows/ai-linux.yml
  pull_request:
    paths:
      - ai_service/**
      - specs/ai-developer/**
      - .github/workflows/ai-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-flow-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install isolated core flow runtime dependencies
        run: python -m pip install --disable-pip-version-check -r ai_service/requirements-integrated.txt -r ai_service/contract_mock/requirements.txt
      - name: Check combined runtime and mock dependency compatibility
        run: python -m pip check
      - name: Verify real SDK analysis through mock confirmation without API calls
        working-directory: ai_service
        run: python -m unittest discover -s core_flow_tests -v

  contract-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install isolated contract mock dependencies
        run: python -m pip install --disable-pip-version-check -r ai_service/contract_mock/requirements.txt
      - name: Check mock dependency compatibility
        run: python -m pip check
      - name: Verify public contract and loopback flow without model calls
        working-directory: ai_service
        run: python -m unittest discover -s contract_tests -v

  unit-and-worker-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install AI service and test dependencies
        run: python -m pip install --disable-pip-version-check -r ai_service/requirements.txt httpx==0.28.1
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify real Linux PDF worker memory limit
        working-directory: ai_service
        run: python -m unittest tests.test_worker_memory.WorkerMemoryTests.test_child_cannot_commit_more_than_its_limit -v
      - name: Run AI service tests including real Linux PDF memory limit
        working-directory: ai_service
        run: python -m unittest discover -s tests -q

  integrated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install optional integrated analysis runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r ai_service/requirements-integrated.txt -r ai_service/requirements-dev.txt
      - name: Check optional runtime dependency compatibility
        run: python -m pip check
      - name: Exercise installed LangExtract and integrated analysis without API calls
        working-directory: ai_service
        run: python -m unittest discover -s runtime_tests -v
      - name: Verify existing service behavior with optional dependencies installed
        working-directory: ai_service
        run: python -m unittest discover -s tests -q
